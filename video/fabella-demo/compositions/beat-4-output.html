<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>beat-4-output</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  html, body { width:1920px; height:1080px; margin:0; background:transparent; font-family:"Outfit",sans-serif; }
  .wrap { width:1920px; height:1080px; display:flex; align-items:center; padding:0 96px; box-sizing:border-box; gap:56px; }
  .stack { display:flex; flex-direction:column; gap:16px; }
  .card { width:760px; padding:18px 22px; border-radius:14px; border:1px solid #E2DCCD; background:#FFFFFF;
    color:#1F2330; display:flex; flex-direction:column; gap:6px; box-shadow:0 8px 22px -18px rgba(20,30,20,0.18); }
  .card .head { font:600 12px "JetBrains Mono",monospace; letter-spacing:0.14em; text-transform:uppercase; color:#2E5A36; }
  .card .body { font:500 22px "Outfit",sans-serif; color:#1F2330; }
  .video-wrap { flex:1; height:760px; max-width:760px; border-radius:18px; overflow:hidden;
    box-shadow:0 1px 0 rgba(0,0,0,0.02), 0 30px 80px -36px rgba(20,30,20,0.32); border:1px solid #E2DCCD; background:#0e1116; }
  .video-wrap video { width:100%; height:100%; object-fit:cover; object-position:top left; }
</style>
</head>
<body>
<div data-composition-id="beat-4-output" data-start="0" data-duration="9" data-width="1920" data-height="1080" data-track-index="1" style="position:relative; width:1920px; height:1080px;">
  <div class="wrap">
    <div class="stack">
      <div class="card" id="b4-card-1">
        <div class="head">Where to begin</div>
        <div class="body">I want to talk to you about Grandma.</div>
      </div>
      <div class="card" id="b4-card-2">
        <div class="head">The explanation</div>
        <div class="body">Grandma is in the hospital. Doctors are helping her feel better. We are all sending her good thoughts.</div>
      </div>
      <div class="card" id="b4-card-3">
        <div class="head">How to land it</div>
        <div class="body">We can think about her together.</div>
      </div>
      <div class="card" id="b4-card-4">
        <div class="head">If they ask another question</div>
        <div class="body">If you have more questions about it, please ask me.</div>
      </div>
    </div>
    <div class="video-wrap">
      <video id="b4-video" data-start="0" data-duration="9" src="../renders/recording-clips/populated.mp4" muted playsinline preload="auto"></video>
    </div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
window.__timelines['beat-4-output'] = gsap.timeline({ paused: true });
</script>
</body>
</html>
