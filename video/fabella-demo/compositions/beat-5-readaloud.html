<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>beat-5-readaloud</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  html, body { width:1920px; height:1080px; margin:0; background:transparent; font-family:"Outfit",sans-serif; }
  .wrap { width:1920px; height:1080px; padding:96px; box-sizing:border-box; display:flex; align-items:center; justify-content:center; }
  .video-wrap { width:1480px; height:900px; border-radius:18px; overflow:hidden; position:relative;
    box-shadow:0 1px 0 rgba(0,0,0,0.02), 0 30px 80px -36px rgba(20,30,20,0.32); border:1px solid #E2DCCD; background:#0e1116; }
  .video-wrap video { width:100%; height:100%; object-fit:cover; object-position:top left; }
  .badge {
    position:absolute; left:50%; top:42px; transform:translateX(-50%);
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,0.94); border:1px solid #E2DCCD; border-radius:999px;
    padding:10px 22px; box-shadow:0 8px 22px -18px rgba(20,30,20,0.18);
  }
  .badge .dot { width:14px; height:14px; border-radius:50%; background:#4F7A4A; box-shadow:0 0 0 6px rgba(79,122,74,0.18); }
  .badge .label { font:600 16px "Outfit",sans-serif; color:#1F2330; letter-spacing:0.04em; }
  .badge .sub { font:500 11px "JetBrains Mono",monospace; letter-spacing:0.12em; text-transform:uppercase; color:#6B6F78; }
</style>
</head>
<body>
<div data-composition-id="beat-5-readaloud" data-start="0" data-duration="9" data-width="1920" data-height="1080" data-track-index="1" style="position:relative; width:1920px; height:1080px; padding:96px; box-sizing:border-box;">
  <div class="wrap">
    <div class="video-wrap">
      <video id="b5-video" data-start="0" data-duration="9" src="../renders/recording-clips/readaloud.mp4" muted playsinline preload="auto"></video>
      <div class="badge">
        <div class="dot"></div>
        <div class="label">VoxCPM2</div>
        <div class="sub">read aloud</div>
      </div>
    </div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
window.__timelines['beat-5-readaloud'] = gsap.timeline({ paused: true });
</script>
</body>
</html>
